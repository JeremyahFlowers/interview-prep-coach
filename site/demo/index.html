<!doctype html>
<html lang="en">
<head>
  <base href="../" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ledger</title>
  <meta name="description" content="Spaced-repetition tracker, weak-pattern dashboard, and mock-interview trainer for coding interview prep." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#123B3A" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The nav is two rows of buttons, so without this a keyboard user tabs
       through every chapter and every page link before reaching the content —
       on every single view change. -->
  <a class="skip-link" href="demo/#view-root">Skip to content</a>
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">{ }</span> Ledger</h1>
    <!-- Filled in by app.js on any channel that isn't the published one. Not
         hidden behind a setting: the failure this prevents is not knowing which
         copy of the app you are looking at, and a badge you have to go and find
         does not prevent it. -->
    <span id="channel-badge" class="channel-badge" hidden></span>
    <!-- Search is the fastest way to anything in the app, so it gets the
         centre of the header and a real input rather than an icon that opens
         a dialog. Typing into it is the whole interaction. -->
    <div class="topbar-search">
      <input id="search-input" class="search-input" type="search" autocomplete="off"
             placeholder="Search problems, patterns, topics…" aria-label="Search"
             role="combobox" aria-expanded="false" aria-controls="search-results" />
      <div id="search-panel" class="search-panel" hidden></div>
    </div>
    <div class="row gap-sm" style="align-items:center">
      <!-- A shortcut nobody knows about may as well not exist. -->
      <button id="shortcut-hint" class="shortcut-hint" type="button"
              title="Keyboard shortcuts">Press <kbd>?</kbd></button>
      <span id="sync-status" class="status"></span>
    </div>
  </header>
  <nav id="tab-nav" class="tab-nav" aria-label="Sections" hidden></nav>
  <main id="view-root" tabindex="-1"></main>
  <!-- Outside <main> on purpose: every view swap replaces <main>, so a footer in here is never removed. Filled and
       unhidden by app.js (js/support-link.js); stays hidden if that script never runs. -->
  <footer id="support-footer" class="support-footer" hidden></footer>
  <!-- The plant, standing by on every page except Home so the "am I overdoing
       it" signal is visible while working rather than a page away. Inert by
       design: aria-hidden because the dashboard already states all of this in
       text for a screen reader, and pointer-events:none in the stylesheet so
       it can never be tapped out of a session by accident. -->
  <div id="plant-widget" class="plant-widget" aria-hidden="true" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <!-- Switching view swaps the whole of <main> with no page load, which a
       screen reader is otherwise given no indication of. -->
  <div id="view-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
  <script type="module" src="demo/demo-boot.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
